{{define "content" }}

<table>
    <thead>
        <tr>
            <th>Name</th>
            <th>Discipline</th>
            <th>Details</th>
        </tr>
    </thead>
    <tbody>
        {{ range .Data}}
        <tr>
            <td>{{ .FirstName }} {{ .LastName }}</td>
            <td>{{ .Discipline }}</td>
            <td>
                {{template "component.link" .}}
            </td>
        </tr>
        {{end }}
    </tbody>
</table>



{{end}}
